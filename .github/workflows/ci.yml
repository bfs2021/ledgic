name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job gets read-only repo contents unless it opts into more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches; never cancel runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/core
    env:
      LLM_MODE: fixture
      WORKER_ENABLED: "false"
      REPLAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/core/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        # pyproject addopts already deselect `-m integration`; DB-backed tests skip without Supabase.
        run: uv run pytest -q

  web:
    name: web (typecheck + lint + tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Design-token lint
        run: pnpm --filter @ledgic/web check:tokens

  db:
    name: db (migrations + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0 # pinned; same CLI that applies the hosted migrations
      - name: Start local Supabase
        run: supabase start
      - name: Reset database (apply all migrations)
        run: supabase db reset
      - name: pgTAP tests
        run: supabase test db
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  core-db:
    name: core (DB-backed + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/core
    env:
      LLM_MODE: fixture
      WORKER_ENABLED: "false"
      REPLAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0 # same pin as the db job
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/core/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Start local Supabase (applies all migrations)
        working-directory: .
        run: supabase start
      - name: Point core at the local stack
        working-directory: .
        # Local-only keys from `supabase status`; demo passwords are random per run.
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          viewer_pw="ci-$(openssl rand -hex 16)"
          elena_pw="ci-$(openssl rand -hex 16)"
          for v in "$SERVICE_ROLE_KEY" "$JWT_SECRET" "$viewer_pw" "$elena_pw"; do echo "::add-mask::$v"; done
          {
            echo "DATABASE_URL=$DB_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
            echo "DEMO_VIEWER_PASSWORD=$viewer_pw"
            echo "DEMO_ELENA_PASSWORD=$elena_pw"
          } >> "$GITHUB_ENV"
      - name: Seed the demo org
        run: uv run python -m app.demo.seed
      - name: DB-backed unit tests and integration scenarios
        # Overrides the default `-m 'not integration'` so both sets run; -rs lists any skip with its reason.
        run: uv run pytest -q -m "integration or not integration" -rs
      - name: Stop Supabase
        if: always()
        working-directory: .
        run: supabase stop --no-backup

  secrets:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz (matches the release's checksums.txt and asset digest).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full git history, not just the PR/push range
          persist-credentials: false
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan full history
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --verbose --exit-code 1 .'
